[package]
name = "ntfry"
version = "0.1.0"
edition = "2021"
description = "ntfry — In-Memory Encrypted Virtual File System (Zero-Knowledge cloud vault: BIP-39 → ZSTD → ChaCha20-Poly1305 → GDrive/Yandex)"
license = "MIT"

[[bin]]
name = "ntfry"
path = "src/main.rs"

[dependencies]
# --- асинхронный рантайм + HTTP-клиент облачных провайдеров ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
bytes = "1"

# --- CLI ---
clap = { version = "4", features = ["derive", "env"] }

# --- криптослой: BIP-39 сид → BIP-32 деривация → ChaCha20-Poly1305 (AEAD) ---
tiny-bip39 = "1"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
secp256k1 = { version = "0.29", features = ["std"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"

# --- сжатие чанков (пользовательские ZSTD-словари + обучение) ---
zstd = { version = "0.13", features = ["zdict_builder"] }

# --- сериализация VaultIndex ---
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

# --- локальный кэш индекса ---
sled = "0.34"

# --- ошибки / утилиты ---
thiserror = "1"
async-trait = "0.1"
anyhow = "1"
hex = "0.4"
