[package]
name = "mail-crypto"
version = "0.8.0"
edition = "2021"
description = "Oxid Mail protocol crypto: NTFRY envelope, registry hashing (Argon2id+BLAKE3), seed-derived keys, anti-spoofing signatures"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
argon2 = "0.5"
blake3 = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
zstd = "0.13"
hkdf = "0.12"
secp256k1 = { version = "0.29", features = ["std"] }
base64 = "0.22"
rand = "0.8"
hex = "0.4"
