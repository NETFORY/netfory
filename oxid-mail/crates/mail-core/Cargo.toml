[package]
name = "mail-core"
version = "0.8.0"
edition = "2021"
description = "Oxid Mail core: BIP-39 identity (SmartHoldem), IMAP fetch, SMTP send, message parsing"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tiny-bip39 = "1"
secp256k1 = { version = "0.29", features = ["std"] }
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
imap = { version = "2.4", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "rustls-native-certs"] }
mail-parser = "0.9"
mail-store = { path = "../mail-store" }
mail-crypto = { path = "../mail-crypto" }
num-bigint = "0.4"
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
ureq = { version = "2", features = ["json"] }
webbrowser = "1"
base64 = "0.22"
rand = "0.8"
ammonia = "4"
