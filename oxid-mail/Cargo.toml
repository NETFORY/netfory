[workspace]
resolver = "2"
members = ["crates/mail-core", "crates/mail-crypto", "crates/mail-store", "crates/oxid-bridge", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3
