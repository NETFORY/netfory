[package]
name = "smartnet-client"
version = "1.137.1"
description = "NETFORY - SmartHoldem WEB4 P2P network"
authors = ["SmartHoldem Developers"]
edition = "2021"
rust-version = "1.91"

# Tauri v2 layout: the app logic lives in the library (`smartnet_lib`),
# `main.rs` is a thin launcher. This is required for desktop + mobile targets.
[lib]
name = "smartnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables the multi-webview API (Window::add_child) so dApp tabs are
# real native child webviews embedded in the main window (not iframes).
tauri = { version = "2", features = ["unstable", "protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# dev:// OS-level deep linking (Фаза 1): внешний клик по dev://… открывает SmartNet.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
once_cell = "1"

# --- physical disk capacity probe (Settings → Storage / STH Earn limit) ---
sysinfo = { version = "0.33", default-features = false, features = ["disk", "system", "network"] }
socket2 = "0.6"

# --- LOCAL neural translation layer (AI Translation Layer for the Wall) ---
# Fully offline inference on CPU via candle + quantized Qwen2.5-1.5B-Instruct
# (GGUF Q8_0). No external translation APIs. Threads capped at max(1, cpus/2)
# and never more than 4 (RAYON_NUM_THREADS) so P2P seeding never freezes.
candle-core = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
num_cpus = "1"
whatlang = "0.16"

# --- OPTIONAL Bonsai (Q1_0 1-bit) support via FFI to llama.cpp ---
# candle 0.9 не читает GGUF-тип Q1_0 (Bonsai). Для Bonsai-8B/4B подключаем
# llama-cpp-2 (safe-биндинги к llama.cpp; Q1_0 уже в upstream). Тяжёлая C++/cmake
# сборка → фича ВЫКЛ по умолчанию. Включать при релизной сборке:
#   yarn tauri build -- --features p2p,bonsai          (CPU)
#   yarn tauri build -- --features p2p,bonsai-cuda      (NVIDIA)
#   yarn tauri build -- --features p2p,bonsai-metal     (Apple Silicon)
# Версия ЗАКРЕПЛЕНА (=): в 0.1.154+ токенизация переехала с LlamaModel в LlamaVocab
# (str_to_token/token_to_piece/is_eog_token/AddBos) — translator.rs написан под 0.1.153.
llama-cpp-2 = { version = "=0.1.153", optional = true }
# llama-cpp-2 0.1.153 требует llama-cpp-sys-2 ^0.1.153 — без закрепления уедет на новые биндинги.
llama-cpp-sys-2 = { version = "=0.1.153", optional = true }
encoding_rs = { version = "0.8", optional = true }

# --- HTTP client (blocking; no async runtime needed) ---
# WAN discovery tracker (plain HTTP) + SmartHoldem node REST API (HTTPS, needs
# TLS) — default features bring rustls so https://node0.smartholdem.io works.
ureq = { version = "2", features = ["tls"] }

# --- LAN peer discovery (mDNS) ---
mdns-sd = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# «Проверить мой IP» (SitePanel): HTTPS поверх mushroom-потока
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

# --- native crypto (SmartHoldem / ARK model) ---
secp256k1 = { version = "0.29", features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
ripemd = "0.1"
md-5 = "0.10"
bs58 = { version = "0.5", features = ["check"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
netfory-chat-core = { path = "../../crates/netfory-chat-core" }
hex = "0.4"
anyhow = "1"
rand = "0.8"
blake3 = "1"

# --- SmartHoldem transaction engine (legacy bip-schnorr scalar math) ---
num-bigint = "0.4"

# --- P2P blob transit (iroh-blobs) — OPTIONAL, behind the `p2p` feature.
# iroh 1.0 is the first STABLE release; iroh-blobs 0.103 depends on iroh ^1.0.
# This pair pins a working ed25519-dalek (=3.0.0-rc.0); a mismatched pair (e.g.
# 0.91 + 0.95) makes cargo resolve the BROKEN ed25519-dalek 3.0.0-pre.1.
# After changing these, run `cargo update` (or delete src-tauri/Cargo.lock).
iroh = { version = "1", optional = true, features = ["unstable-net-report"] }
iroh-relay = { version = "1", optional = true }
iroh-blobs = { version = "0.103", optional = true }
iroh-gossip = { version = "0.101", optional = true }

# --- Crypto Vault (ntfry): Zero-Knowledge облачное E2EE-хранилище ---
ntfry = { path = "../../ntfry" }
n0-future = { version = "0.3", optional = true }
# Mycelium — mushroom-маршрутизация (NIP-1) поверх iroh, крейт в /app/mycelium
mycelium = { path = "../../mycelium", optional = true }
# Голосовые звонки (chat/voice.rs): захват/воспроизведение + Opus (libopus собирается из исходников — нужен cmake)
cpal = { version = "0.15", optional = true }
opus = { version = "0.3", optional = true }
nnnoiseless = { version = "0.5", optional = true, default-features = false }
rustfft = { version = "6", optional = true }
iroh-mdns-address-lookup = { version = "0.4", optional = true }
iroh-mainline-address-lookup = { version = "0.4", optional = true }
n0-mainline = { version = "0.5", optional = true }
tar = "0.4"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync", "fs", "io-util", "net"] }
# --- embedded BitTorrent client (rqbit core) — OPTIONAL, behind the `p2p` feature.
# Pure-Rust async stack on tokio with built-in DHT, large-file disk IO and
# sequential streaming. 9.0.0-rc.0 adds µTP (TCP+uTP) — required to reach
# CGNAT/NAT'd peers (RU residential), matching qBittorrent connectivity.
librqbit = { version = "=9.0.0-rc.0", optional = true, default-features = false, features = ["rust-tls"] }
# Пин транзитивной зависимости: вышедший librqbit-tracker-comms 9.0.0 (не rc.0)
# собран против reqwest 0.13 и ломает librqbit 9.0.0-rc.0 (E0308 reqwest mismatch).
librqbit-tracker-comms = { version = "=9.0.0-rc.0", optional = true }
tauri-plugin-notification = "2"
maxminddb = "0.28.1"
flate2 = "1.1.9"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "=2.5.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lofty = "0.24.0"

# Linux: прямой доступ к GTK-дереву окна — репарентинг child-webview'ов
# dApp из GtkBox в GtkOverlay+GtkFixed (см. webview.rs::linux_embed_bounds).
# Версия обязана совпадать с gtk из графа wry/webkit2gtk (Cargo.lock: 0.18.x).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Linux/WebKitGTK: сигнал load-failed web-вкладок → своя страница ошибки
# (websites.rs::install_error_page). Версия/фичи как у wry 0.55 (Cargo.lock: 2.0.x, v2_40).
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# Windows/WebView2: авто-ALLOW микрофона для окна мессенджера (голосовые).
# Версия обязана совпадать с webview2-com из графа wry 0.55 (Cargo.lock: 0.38.x).
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# Контекстное меню ссылок web-вкладок (websites.rs::install_link_menu): Interface::cast,
# BOOL, IStream. Версии как у webview2-com 0.38 (Cargo.lock: windows 0.61.x, windows-core 0.61.x).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com"] }
windows-core = "0.61"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
p2p = ["dep:mycelium", "dep:cpal", "dep:opus", "dep:nnnoiseless", "dep:rustfft", "dep:iroh", "dep:iroh-relay", "dep:iroh-blobs", "dep:iroh-gossip", "dep:n0-future", "dep:iroh-mdns-address-lookup", "dep:iroh-mainline-address-lookup", "dep:n0-mainline", "dep:librqbit", "dep:librqbit-tracker-comms"]
# --- OPTIONAL GPU acceleration for the local AI translator (candle) ---
# Off by default so the client builds on any machine. Enable at local build:
#   cuda  → external NVIDIA GPU (requires the CUDA Toolkit installed):
#           yarn tauri build -- --features p2p,cuda
#   metal → Apple Silicon / macOS (works out of the box):
#           yarn tauri build -- --features p2p,metal
cuda = ["candle-core/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-transformers/metal"]
# --- OPTIONAL Bonsai (Q1_0) via llama.cpp FFI — off by default (heavy C++ build).
bonsai = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs"]
bonsai-cuda = ["bonsai", "llama-cpp-2/cuda"]
bonsai-metal = ["bonsai", "llama-cpp-2/metal"]

[profile.release]
debug = "line-tables-only"
strip = false

# SMARTNET: локальный патч iroh 1.0.0 — см. vendor/iroh/src/socket/remote_map/remote_state.rs
# (взрывной рост pending_open_paths → OOM при простое). Убрать, когда исправят upstream.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
# sth-core патчи iroh-gossip 0.101.0 (#145 утечка соединений под churn, #172, зависание актора на медленном пире)
iroh-gossip = { path = "vendor/iroh-gossip" }
