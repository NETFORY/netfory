[package]
name = "mycelium"
version = "0.1.0"
edition = "2021"
description = "NETFORY Mycelium — mushroom-маршрутизация (NIP-1) поверх Iroh QUIC: 3 хопа, X25519/HKDF/ChaCha20-Poly1305, ячейки 2048 байт"
license = "MIT"

[[bin]]
name = "myceliumd"
path = "src/bin/myceliumd.rs"
required-features = ["daemon"]

# Фаза 3: привилегированный TUN-помощник системного VPN (tun2proxy → SOCKS5 Netfory).
[[bin]]
name = "mycelium-tun"
path = "src/bin/mycelium-tun.rs"
required-features = ["tun"]

[features]
default = []
daemon = ["toml", "tracing-subscriber", "dirs"]
tun = ["tun2proxy", "clap", "log"]

[dependencies]
iroh = "1"
iroh-gossip = "0.101"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs", "signal"] }
bytes = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
toml = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
dirs = { version = "5", optional = true }
tun2proxy = { version = "0.8", default-features = false, optional = true }
clap = { version = "4", optional = true }
log = { version = "0.4", optional = true }

# Автономная сборка (myceliumd): те же патчи iroh/iroh-gossip, что и у Netfory.
# При использовании как зависимость Netfory этот блок игнорируется (действует [patch] корня).
[patch.crates-io]
iroh = { path = "../frontend/src-tauri/vendor/iroh" }
iroh-gossip = { path = "../frontend/src-tauri/vendor/iroh-gossip" }
